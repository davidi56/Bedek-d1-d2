<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>טיפול בבדק ד1 ד2</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: #2e3352;
    --accent: #f5a623;
    --accent2: #e05c5c;
    --text: #e8eaf0;
    --text2: #8b90a7;
    --green: #4caf82;
    --radius: 14px;
  }

  body {
    font-family: 'Heebo', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* HEADER */
  header {
    background: linear-gradient(135deg, #1a1d27 0%, #12152a 100%);
    border-bottom: 2px solid var(--accent);
    padding: 18px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 4px 30px rgba(0,0,0,0.5);
  }

  header h1 {
    font-size: 1.6rem;
    font-weight: 800;
    letter-spacing: -0.5px;
    color: var(--text);
  }

  header h1 span {
    color: var(--accent);
  }

  .header-stats {
    display: flex;
    gap: 20px;
    align-items: center;
  }

  .stat-pill {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 50px;
    padding: 6px 16px;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--text2);
  }

  .stat-pill span { color: var(--accent); font-size: 1rem; }

  /* MAIN LAYOUT */
  main {
    padding: 32px;
    max-width: 1400px;
    margin: 0 auto;
  }

  .section-title {
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text2);
    margin-bottom: 20px;
  }

  /* ADD BTN */
  .add-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--accent);
    color: #0f1117;
    border: none;
    border-radius: 50px;
    padding: 10px 22px;
    font-size: 0.9rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'Heebo', sans-serif;
    margin-bottom: 28px;
  }
  .add-btn:hover { background: #ffba4d; transform: translateY(-1px); box-shadow: 0 6px 20px rgba(245,166,35,0.3); }

  /* BUILDINGS GRID */
  .buildings-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
  }

  .building-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    cursor: pointer;
    transition: all 0.25s;
    position: relative;
    overflow: hidden;
  }

  .building-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    opacity: 0;
    transition: opacity 0.2s;
  }

  .building-card:hover { border-color: var(--accent); transform: translateY(-3px); box-shadow: 0 12px 40px rgba(0,0,0,0.4); }
  .building-card:hover::before { opacity: 1; }

  .building-icon {
    width: 52px; height: 52px;
    background: var(--surface2);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.6rem;
    margin-bottom: 14px;
  }

  .building-name {
    font-size: 1.15rem;
    font-weight: 700;
    margin-bottom: 6px;
  }

  .building-sub {
    font-size: 0.82rem;
    color: var(--text2);
    margin-bottom: 16px;
  }

  .building-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .fault-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(224,92,92,0.15);
    border: 1px solid rgba(224,92,92,0.4);
    color: var(--accent2);
    border-radius: 50px;
    padding: 5px 14px;
    font-size: 0.8rem;
    font-weight: 700;
  }

  .fault-badge.zero {
    background: rgba(76,175,130,0.1);
    border-color: rgba(76,175,130,0.3);
    color: var(--green);
  }

  .badge-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: currentColor;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* MODAL OVERLAY */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(6px);
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
  }

  .modal-overlay.active {
    opacity: 1;
    pointer-events: all;
  }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    width: 100%;
    max-width: 750px;
    max-height: 90vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transform: translateY(20px);
    transition: transform 0.25s;
    box-shadow: 0 30px 80px rgba(0,0,0,0.6);
  }

  .modal-overlay.active .modal {
    transform: translateY(0);
  }

  .modal-header {
    padding: 24px 28px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: linear-gradient(135deg, var(--surface) 0%, var(--surface2) 100%);
    flex-shrink: 0;
  }

  .modal-title {
    font-size: 1.2rem;
    font-weight: 800;
  }

  .modal-title small {
    display: block;
    font-size: 0.75rem;
    color: var(--text2);
    font-weight: 400;
    margin-top: 2px;
  }

  .close-btn {
    width: 36px; height: 36px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 50%;
    color: var(--text2);
    font-size: 1.2rem;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  .close-btn:hover { background: var(--accent2); color: white; border-color: var(--accent2); }

  .modal-body {
    padding: 24px 28px;
    overflow-y: auto;
    flex: 1;
  }

  /* APARTMENTS GRID */
  .apartments-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 14px;
    margin-top: 16px;
  }

  .apt-card {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    text-align: center;
  }

  .apt-card:hover { border-color: var(--accent); transform: translateY(-2px); }

  .apt-number {
    font-size: 1.4rem;
    font-weight: 800;
    color: var(--accent);
    margin-bottom: 4px;
  }

  .apt-label { font-size: 0.8rem; color: var(--text2); margin-bottom: 10px; }

  .apt-badge {
    display: inline-block;
    background: rgba(224,92,92,0.15);
    border: 1px solid rgba(224,92,92,0.35);
    color: var(--accent2);
    border-radius: 50px;
    padding: 3px 10px;
    font-size: 0.72rem;
    font-weight: 700;
  }

  .apt-badge.zero {
    background: rgba(76,175,130,0.1);
    border-color: rgba(76,175,130,0.3);
    color: var(--green);
  }

  /* APT DETAIL MODAL */
  .tabs {
    display: flex;
    gap: 4px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 24px;
    overflow-x: auto;
    flex-shrink: 0;
    padding: 0 28px;
  }

  .tab-btn {
    padding: 12px 16px;
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--text2);
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    font-family: 'Heebo', sans-serif;
    white-space: nowrap;
    transition: all 0.2s;
    margin-bottom: -1px;
  }

  .tab-btn.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  .tab-btn:hover:not(.active) { color: var(--text); }

  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* FORM FIELDS */
  .field-group {
    margin-bottom: 18px;
  }

  .field-group label {
    display: block;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: var(--text2);
    margin-bottom: 7px;
    text-transform: uppercase;
  }

  .field-group input,
  .field-group textarea,
  .field-group select {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    color: var(--text);
    font-family: 'Heebo', sans-serif;
    font-size: 0.9rem;
    outline: none;
    transition: border-color 0.2s;
    resize: vertical;
  }

  .field-group input:focus,
  .field-group textarea:focus,
  .field-group select:focus {
    border-color: var(--accent);
  }

  .field-group select option { background: var(--surface); }

  /* FAULTS */
  .faults-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .faults-title { font-size: 0.9rem; font-weight: 700; }

  .add-fault-btn {
    width: 34px; height: 34px;
    background: var(--accent);
    border: none;
    border-radius: 50%;
    color: #0f1117;
    font-size: 1.3rem;
    font-weight: 700;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
    line-height: 1;
  }

  .add-fault-btn:hover { background: #ffba4d; transform: scale(1.1); }

  .fault-item {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
    position: relative;
  }

  .fault-item-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .fault-num {
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--accent);
    background: rgba(245,166,35,0.1);
    padding: 3px 10px;
    border-radius: 50px;
  }

  .remove-fault-btn {
    background: none;
    border: none;
    color: var(--text2);
    cursor: pointer;
    font-size: 0.85rem;
    padding: 4px 8px;
    border-radius: 6px;
    transition: all 0.2s;
  }

  .remove-fault-btn:hover { background: rgba(224,92,92,0.15); color: var(--accent2); }

  /* SAVE BTN */
  .save-btn {
    background: var(--green);
    color: white;
    border: none;
    border-radius: 10px;
    padding: 12px 28px;
    font-size: 0.9rem;
    font-weight: 700;
    cursor: pointer;
    font-family: 'Heebo', sans-serif;
    transition: all 0.2s;
    margin-top: 10px;
    width: 100%;
  }

  .save-btn:hover { opacity: 0.85; }

  /* MODAL TABS WRAPPER */
  .apt-modal-tabs {
    display: flex;
    flex-direction: column;
    height: 100%;
  }

  .apt-modal-tabs .modal-body {
    padding: 0;
  }

  .tab-panel-wrap {
    padding: 20px 28px 24px;
    overflow-y: auto;
    flex: 1;
  }

  .empty-state {
    text-align: center;
    padding: 40px;
    color: var(--text2);
  }

  .empty-icon { font-size: 2.5rem; margin-bottom: 10px; }

  /* Building add form */
  .add-form {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 28px;
    display: none;
  }

  .add-form.visible { display: block; }

  .add-form-row {
    display: flex;
    gap: 12px;
    align-items: flex-end;
  }

  .add-form-row .field-group { flex: 1; margin-bottom: 0; }

  .confirm-btn {
    background: var(--accent);
    color: #0f1117;
    border: none;
    border-radius: 10px;
    padding: 12px 20px;
    font-weight: 700;
    cursor: pointer;
    font-family: 'Heebo', sans-serif;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .confirm-btn:hover { background: #ffba4d; }

  scrollbar-width: thin;
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
</style>
</head>
<body>

<header>
  <h1>🏗 טיפול בבדק <span>ד1 ד2</span></h1>
  <div class="header-stats">
    <div class="stat-pill">בניינים: <span id="total-buildings">0</span></div>
    <div class="stat-pill">תקלות פתוחות: <span id="total-faults">0</span></div>
    <button onclick="exportData()" style="background:#f5a623;border:none;border-radius:50px;padding:8px 18px;font-weight:700;font-family:Heebo,sans-serif;font-size:0.85rem;cursor:pointer;color:#0f1117;">📤 ייצוא נתונים</button>
  </div>
</header>

<main>
  <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;">
    <div class="section-title">בניינים</div>
  </div>

  <button class="add-btn" onclick="toggleAddBuilding()">
    + הוסף בניין
  </button>

  <div class="add-form" id="add-building-form">
    <div class="add-form-row">
      <div class="field-group">
        <label>שם / כתובת הבניין</label>
        <input type="text" id="new-building-name" placeholder="לדוגמה: רחוב הרצל 12, ראשון לציון" />
      </div>
      <div class="field-group" style="max-width:180px">
        <label>מספר דירות</label>
        <input type="number" id="new-building-apts" placeholder="24" min="1" />
      </div>
      <button class="confirm-btn" onclick="addBuilding()">הוסף ✓</button>
    </div>
  </div>

  <div class="buildings-grid" id="buildings-grid">
    <div class="empty-state" id="empty-buildings">
      <div class="empty-icon">🏢</div>
      <div>אין בניינים עדיין. לחץ על "הוסף בניין" כדי להתחיל.</div>
    </div>
  </div>
</main>

<!-- BUILDING MODAL -->
<div class="modal-overlay" id="building-modal">
  <div class="modal" style="max-width:820px">
    <div class="modal-header">
      <div class="modal-title" id="building-modal-title">
        בניין
        <small id="building-modal-sub"></small>
      </div>
      <div style="display:flex;gap:10px;align-items:center">
        <div class="fault-badge" id="building-modal-badge">0 תקלות</div>
        <button class="close-btn" onclick="closeModal('building-modal')">×</button>
      </div>
    </div>
    <div class="modal-body">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
        <div class="section-title" style="margin:0">דירות בבניין</div>
        <button class="add-btn" style="margin:0;padding:8px 18px;font-size:0.82rem;" onclick="showAddApt()">+ הוסף דירה</button>
      </div>
      <div class="add-form" id="add-apt-form" style="margin-bottom:16px;">
        <div class="add-form-row">
          <div class="field-group">
            <label>מספר דירה</label>
            <input type="text" id="new-apt-num" placeholder="לדוגמה: 14" />
          </div>
          <div class="field-group">
            <label>קומה</label>
            <input type="number" id="new-apt-floor" placeholder="3" min="0" />
          </div>
          <button class="confirm-btn" onclick="addApt()">הוסף ✓</button>
        </div>
      </div>
      <div class="apartments-grid" id="apartments-grid"></div>
    </div>
  </div>
</div>

<!-- APT MODAL -->
<div class="modal-overlay" id="apt-modal">
  <div class="modal" style="max-width:680px">
    <div class="modal-header">
      <div class="modal-title" id="apt-modal-title">
        דירה
        <small id="apt-modal-sub"></small>
      </div>
      <div style="display:flex;gap:10px;align-items:center">
        <div class="fault-badge" id="apt-modal-badge">0 תקלות</div>
        <button class="close-btn" onclick="closeModal('apt-modal')">×</button>
      </div>
    </div>
    <div style="padding: 0; display:flex; flex-direction:column; flex:1; overflow:hidden;">
      <div class="tabs" id="apt-tabs">
        <button class="tab-btn active" data-tab="phone" onclick="switchTab('phone', this)">📞 טלפון דייר</button>
        <button class="tab-btn" data-tab="floor" onclick="switchTab('floor', this)">🏢 קומה</button>
        <button class="tab-btn" data-tab="faults" onclick="switchTab('faults', this)">⚠️ תקלה</button>
        <button class="tab-btn" data-tab="treatment" onclick="switchTab('treatment', this)">🔧 צורת טיפול</button>
        <button class="tab-btn" data-tab="followup" onclick="switchTab('followup', this)">📋 מעקב</button>
        <button class="tab-btn" data-tab="notes" onclick="switchTab('notes', this)">📝 הערות</button>
      </div>
      <div style="padding:20px 28px;overflow-y:auto;flex:1;">

        <!-- PHONE TAB -->
        <div class="tab-content active" id="tab-phone">
          <div class="field-group">
            <label>שם הדייר</label>
            <input type="text" id="apt-tenant-name" placeholder="ישראל ישראלי" />
          </div>
          <div class="field-group">
            <label>טלפון</label>
            <input type="tel" id="apt-phone" placeholder="050-0000000" dir="ltr" />
          </div>
          <div class="field-group">
            <label>טלפון נוסף</label>
            <input type="tel" id="apt-phone2" placeholder="(אופציונלי)" dir="ltr" />
          </div>
          <button class="save-btn" onclick="saveApt()">💾 שמור</button>
        </div>

        <!-- FLOOR TAB -->
        <div class="tab-content" id="tab-floor">
          <div class="field-group">
            <label>קומה</label>
            <input type="number" id="apt-floor-input" placeholder="0" min="0" />
          </div>
          <div class="field-group">
            <label>כניסה / מדרגות</label>
            <input type="text" id="apt-entrance" placeholder="כניסה א" />
          </div>
          <button class="save-btn" onclick="saveApt()">💾 שמור</button>
        </div>

        <!-- FAULTS TAB -->
        <div class="tab-content" id="tab-faults">
          <div class="faults-header">
            <div class="faults-title" id="faults-count-label">תקלות: 0</div>
            <button class="add-fault-btn" onclick="addFault()" title="הוסף תקלה">+</button>
          </div>
          <div id="faults-list"></div>
        </div>

        <!-- TREATMENT TAB -->
        <div class="tab-content" id="tab-treatment">
          <div class="field-group">
            <label>סטטוס טיפול</label>
            <select id="apt-treatment-status">
              <option value="">בחר סטטוס</option>
              <option value="pending">ממתין לטיפול</option>
              <option value="scheduled">נקבע מועד</option>
              <option value="in_progress">בטיפול</option>
              <option value="done">טופל</option>
              <option value="partial">טופל חלקית</option>
            </select>
          </div>
          <div class="field-group">
            <label>תאריך טיפול מתוכנן</label>
            <input type="date" id="apt-treatment-date" />
          </div>
          <div class="field-group">
            <label>בעל מקצוע</label>
            <input type="text" id="apt-professional" placeholder="לדוגמה: שרברב, חשמלאי..." />
          </div>
          <div class="field-group">
            <label>פירוט צורת הטיפול</label>
            <textarea id="apt-treatment-desc" rows="4" placeholder="תאר את אופן הטיפול המתוכנן..."></textarea>
          </div>
          <button class="save-btn" onclick="saveApt()">💾 שמור</button>
        </div>

        <!-- FOLLOW UP TAB -->
        <div class="tab-content" id="tab-followup">
          <div class="field-group">
            <label>סטטוס מעקב</label>
            <select id="apt-followup-status">
              <option value="">בחר</option>
              <option value="waiting">ממתין לתגובה</option>
              <option value="contacted">יצרנו קשר</option>
              <option value="confirmed">אושר</option>
              <option value="closed">נסגר</option>
            </select>
          </div>
          <div class="field-group">
            <label>תאריך מעקב אחרון</label>
            <input type="date" id="apt-followup-date" />
          </div>
          <div class="field-group">
            <label>פרטי מעקב</label>
            <textarea id="apt-followup-notes" rows="5" placeholder="רשום כאן עדכונים ומעקב אחר הטיפול..."></textarea>
          </div>
          <button class="save-btn" onclick="saveApt()">💾 שמור</button>
        </div>

        <!-- NOTES TAB -->
        <div class="tab-content" id="tab-notes">
          <div class="field-group">
            <label>הערות כלליות</label>
            <textarea id="apt-notes" rows="8" placeholder="הערות חופשיות לגבי הדירה..."></textarea>
          </div>
          <button class="save-btn" onclick="saveApt()">💾 שמור</button>
        </div>

      </div>
    </div>
  </div>
</div>

<script>
// DATA
let buildings = JSON.parse(localStorage.getItem('bedek_buildings') || '[]');

let currentBuildingId = null;
let currentAptId = null;

function save() {
  localStorage.setItem('bedek_buildings', JSON.stringify(buildings));
}

function getBuilding(id) {
  return buildings.find(b => b.id === id);
}

function getApt(buildingId, aptId) {
  const b = getBuilding(buildingId);
  return b ? b.apartments.find(a => a.id === aptId) : null;
}

function countBuildingFaults(b) {
  return b.apartments.reduce((sum, a) => sum + (a.faults ? a.faults.length : 0), 0);
}

function totalFaults() {
  return buildings.reduce((sum, b) => sum + countBuildingFaults(b), 0);
}

// RENDER BUILDINGS
function renderBuildings() {
  const grid = document.getElementById('buildings-grid');
  const empty = document.getElementById('empty-buildings');
  document.getElementById('total-buildings').textContent = buildings.length;
  document.getElementById('total-faults').textContent = totalFaults();

  grid.innerHTML = '';
  if (buildings.length === 0) {
    grid.appendChild(empty);
    empty.style.display = 'block';
    return;
  }

  buildings.forEach(b => {
    const faults = countBuildingFaults(b);
    const card = document.createElement('div');
    card.className = 'building-card';
    card.onclick = () => openBuilding(b.id);
    card.innerHTML = `
      <div class="building-icon">🏢</div>
      <div class="building-name">${b.name}</div>
      <div class="building-sub">${b.apartments.length} דירות</div>
      <div class="building-footer">
        <div class="fault-badge ${faults === 0 ? 'zero' : ''}">
          <div class="badge-dot"></div>
          ${faults === 0 ? 'ללא תקלות' : faults + ' תקלות'}
        </div>
      </div>
    `;
    grid.appendChild(card);
  });
}

// ADD BUILDING
let addBuildingVisible = false;
function toggleAddBuilding() {
  addBuildingVisible = !addBuildingVisible;
  document.getElementById('add-building-form').classList.toggle('visible', addBuildingVisible);
  if (addBuildingVisible) document.getElementById('new-building-name').focus();
}

function addBuilding() {
  const name = document.getElementById('new-building-name').value.trim();
  if (!name) return alert('יש להזין שם בניין');
  const apts = parseInt(document.getElementById('new-building-apts').value) || 0;
  const b = { id: Date.now().toString(), name, apartments: [] };
  // pre-create apartments if count given
  for (let i = 1; i <= apts; i++) {
    b.apartments.push({ id: Date.now().toString() + i, number: String(i), floor: '', phone: '', phone2: '', tenantName: '', entrance: '', faults: [], treatmentStatus: '', treatmentDate: '', professional: '', treatmentDesc: '', followupStatus: '', followupDate: '', followupNotes: '', notes: '' });
  }
  buildings.push(b);
  save();
  document.getElementById('new-building-name').value = '';
  document.getElementById('new-building-apts').value = '';
  toggleAddBuilding();
  renderBuildings();
}

// OPEN BUILDING MODAL
function openBuilding(id) {
  currentBuildingId = id;
  const b = getBuilding(id);
  document.getElementById('building-modal-title').childNodes[0].textContent = b.name + ' ';
  document.getElementById('building-modal-sub').textContent = b.apartments.length + ' דירות';
  renderBuildingModal(b);
  openModal('building-modal');
}

function renderBuildingModal(b) {
  const faults = countBuildingFaults(b);
  const badge = document.getElementById('building-modal-badge');
  badge.textContent = faults + ' תקלות';
  badge.className = 'fault-badge ' + (faults === 0 ? 'zero' : '');

  const grid = document.getElementById('apartments-grid');
  grid.innerHTML = '';
  if (b.apartments.length === 0) {
    grid.innerHTML = '<div class="empty-state"><div class="empty-icon">🏠</div><div>אין דירות עדיין</div></div>';
    return;
  }
  b.apartments.forEach(a => {
    const f = a.faults ? a.faults.length : 0;
    const card = document.createElement('div');
    card.className = 'apt-card';
    card.onclick = () => openApt(a.id);
    card.innerHTML = `
      <div class="apt-number">דירה ${a.number}</div>
      <div class="apt-label">${a.floor !== '' && a.floor !== undefined ? 'קומה ' + a.floor : 'קומה לא הוגדרה'}</div>
      <div class="apt-badge ${f === 0 ? 'zero' : ''}">${f === 0 ? '✓ תקין' : f + ' תקלות'}</div>
    `;
    grid.appendChild(card);
  });
}

function showAddApt() {
  document.getElementById('add-apt-form').classList.toggle('visible');
}

function addApt() {
  const num = document.getElementById('new-apt-num').value.trim();
  if (!num) return alert('יש להזין מספר דירה');
  const floor = document.getElementById('new-apt-floor').value;
  const b = getBuilding(currentBuildingId);
  b.apartments.push({ id: Date.now().toString(), number: num, floor, phone: '', phone2: '', tenantName: '', entrance: '', faults: [], treatmentStatus: '', treatmentDate: '', professional: '', treatmentDesc: '', followupStatus: '', followupDate: '', followupNotes: '', notes: '' });
  save();
  document.getElementById('new-apt-num').value = '';
  document.getElementById('new-apt-floor').value = '';
  document.getElementById('add-apt-form').classList.remove('visible');
  renderBuildingModal(b);
  renderBuildings();
}

// APT MODAL
function openApt(aptId) {
  currentAptId = aptId;
  const a = getApt(currentBuildingId, aptId);
  const b = getBuilding(currentBuildingId);
  document.getElementById('apt-modal-title').childNodes[0].textContent = 'דירה ' + a.number + ' ';
  document.getElementById('apt-modal-sub').textContent = b.name;

  // fill fields
  document.getElementById('apt-tenant-name').value = a.tenantName || '';
  document.getElementById('apt-phone').value = a.phone || '';
  document.getElementById('apt-phone2').value = a.phone2 || '';
  document.getElementById('apt-floor-input').value = a.floor || '';
  document.getElementById('apt-entrance').value = a.entrance || '';
  document.getElementById('apt-treatment-status').value = a.treatmentStatus || '';
  document.getElementById('apt-treatment-date').value = a.treatmentDate || '';
  document.getElementById('apt-professional').value = a.professional || '';
  document.getElementById('apt-treatment-desc').value = a.treatmentDesc || '';
  document.getElementById('apt-followup-status').value = a.followupStatus || '';
  document.getElementById('apt-followup-date').value = a.followupDate || '';
  document.getElementById('apt-followup-notes').value = a.followupNotes || '';
  document.getElementById('apt-notes').value = a.notes || '';

  renderFaults(a.faults || []);
  updateAptBadge(a);

  switchTab('phone', document.querySelector('.tab-btn[data-tab="phone"]'));
  openModal('apt-modal');
}

function updateAptBadge(a) {
  const f = a.faults ? a.faults.length : 0;
  const badge = document.getElementById('apt-modal-badge');
  badge.textContent = f + ' תקלות';
  badge.className = 'fault-badge ' + (f === 0 ? 'zero' : '');
}

function renderFaults(faults) {
  const list = document.getElementById('faults-list');
  document.getElementById('faults-count-label').textContent = 'תקלות: ' + faults.length;
  list.innerHTML = '';
  if (faults.length === 0) {
    list.innerHTML = '<div class="empty-state" style="padding:30px"><div class="empty-icon">✅</div><div>אין תקלות רשומות</div></div>';
    return;
  }
  faults.forEach((f, idx) => {
    const item = document.createElement('div');
    item.className = 'fault-item';
    item.innerHTML = `
      <div class="fault-item-header">
        <div class="fault-num">תקלה #${idx + 1}</div>
        <button class="remove-fault-btn" onclick="removeFault(${idx})">🗑 הסר</button>
      </div>
      <div class="field-group" style="margin-bottom:10px">
        <label>תיאור התקלה</label>
        <textarea rows="2" placeholder="תאר את התקלה..." onchange="updateFault(${idx}, 'desc', this.value)">${f.desc || ''}</textarea>
      </div>
      <div class="field-group" style="margin-bottom:0">
        <label>סטטוס</label>
        <select onchange="updateFault(${idx}, 'status', this.value)">
          <option value="" ${!f.status ? 'selected' : ''}>בחר סטטוס</option>
          <option value="open" ${f.status === 'open' ? 'selected' : ''}>פתוח</option>
          <option value="in_progress" ${f.status === 'in_progress' ? 'selected' : ''}>בטיפול</option>
          <option value="done" ${f.status === 'done' ? 'selected' : ''}>טופל</option>
        </select>
      </div>
    `;
    list.appendChild(item);
  });
}

function addFault() {
  const a = getApt(currentBuildingId, currentAptId);
  if (!a.faults) a.faults = [];
  a.faults.push({ desc: '', status: 'open' });
  save();
  renderFaults(a.faults);
  updateAptBadge(a);
  renderBuildingModal(getBuilding(currentBuildingId));
  renderBuildings();
}

function removeFault(idx) {
  const a = getApt(currentBuildingId, currentAptId);
  a.faults.splice(idx, 1);
  save();
  renderFaults(a.faults);
  updateAptBadge(a);
  renderBuildingModal(getBuilding(currentBuildingId));
  renderBuildings();
}

function updateFault(idx, field, val) {
  const a = getApt(currentBuildingId, currentAptId);
  a.faults[idx][field] = val;
  save();
  renderBuildings();
  updateAptBadge(a);
  renderBuildingModal(getBuilding(currentBuildingId));
}

function saveApt() {
  const a = getApt(currentBuildingId, currentAptId);
  a.tenantName = document.getElementById('apt-tenant-name').value;
  a.phone = document.getElementById('apt-phone').value;
  a.phone2 = document.getElementById('apt-phone2').value;
  a.floor = document.getElementById('apt-floor-input').value;
  a.entrance = document.getElementById('apt-entrance').value;
  a.treatmentStatus = document.getElementById('apt-treatment-status').value;
  a.treatmentDate = document.getElementById('apt-treatment-date').value;
  a.professional = document.getElementById('apt-professional').value;
  a.treatmentDesc = document.getElementById('apt-treatment-desc').value;
  a.followupStatus = document.getElementById('apt-followup-status').value;
  a.followupDate = document.getElementById('apt-followup-date').value;
  a.followupNotes = document.getElementById('apt-followup-notes').value;
  a.notes = document.getElementById('apt-notes').value;
  save();
  renderBuildingModal(getBuilding(currentBuildingId));
  renderBuildings();

  // visual feedback
  const btn = event.target;
  btn.textContent = '✓ נשמר!';
  btn.style.background = '#4caf82';
  setTimeout(() => { btn.textContent = '💾 שמור'; btn.style.background = ''; }, 1500);
}

// TABS
function switchTab(name, el) {
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  if (el) el.classList.add('active');
}

// MODALS
function openModal(id) {
  document.getElementById(id).classList.add('active');
}

function closeModal(id) {
  document.getElementById(id).classList.remove('active');
}

// close on overlay click
document.querySelectorAll('.modal-overlay').forEach(overlay => {
  overlay.addEventListener('click', function(e) {
    if (e.target === this) closeModal(this.id);
  });
});

// EXPORT
function exportData() {
  const json = JSON.stringify(buildings, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const date = new Date().toLocaleDateString('he-IL').replace(/\//g, '-');
  a.href = url;
  a.download = `bedek_backup_${date}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

// INIT
renderBuildings();
</script>
</body>
</html>
